# H2 em arquivo permite iniciar sem instalar PostgreSQL e mantém dados entre reinicializações.
spring.datasource.url=${DB_URL:jdbc:h2:file:./dados/escola}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
# update simplifica o laboratório; aplicações reais devem usar migrações versionadas.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.h2.console.enabled=false
server.address=127.0.0.1
server.port=8080
# O usuário de estudo precisa definir a própria senha no ambiente antes de iniciar.
estudo.usuario=${ESTUDO_USUARIO:estudante}
estudo.senha=${ESTUDO_SENHA}
server.error.include-message=never
